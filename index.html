<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffffff" />
    <!--
      전화번호·주소 자동 인식을 끈다. 주소를 켜 두면 브라우저가 본문의 주소를 제 맘대로
      링크로 만들어 **기기 기본 지도 앱(대개 구글맵)** 으로 보낸다 — 우리는 상세의 '위치'
      블록에서 카카오맵으로 보내기로 했으므로, 같은 주소가 화면에 따라 다른 지도로
      갈라지면 안 된다.
    -->
    <meta name="format-detection" content="telephone=no, address=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta
      name="description"
      content="통근 효율성과 생활 환경 가중치를 결합해 나만의 매칭 점수로 주거 매물을 추천합니다."
    />
    <title>자취방정식 · 라이프스타일 기반 주거 추천</title>

    <!--
      스플래쉬. 번들이 내려오기 전에 보여야 해서 Vue 컴포넌트가 아니라 여기 둔다 —
      컴포넌트로 만들면 JS 가 실행된 다음에야 뜨고, 그 전까지는 흰 화면이다.
      Vue 가 #app 에 마운트하면서 이 안을 비우므로 따로 지울 필요가 없다.
    -->
    <style>
      .splash {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #00c8b3;
      }
      .splash img {
        width: 60%;
        max-width: 17rem;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="splash">
        <img src="/logo-white.svg" width="229" height="45" alt="자취방정식" />
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
